version: 0.0
os: linux

files:
  - source: /
    destination: /home/admin/consultancy-cms

file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: deploy/before-install.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: deploy/after-install.sh
      timeout: 1200
      runas: root

  ApplicationStart:
    - location: deploy/start-service.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: deploy/validate-service.sh
      timeout: 180
      runas: root
