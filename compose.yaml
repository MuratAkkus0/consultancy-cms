services:
  db:
    image: postgres:18.4-alpine3.23
    container_name: cms-postgres-db
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - ${DB_PORT:-9001}:5432
    volumes:
      - postgres-data:/var/lib/postgresql 
volumes:
  postgres-data:
